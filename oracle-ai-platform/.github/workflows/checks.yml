name: New platform checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chromium
  postgres-rls:
    # Real PostgreSQL as the non-owner runtime role. Throwaway CI-only credentials.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-owner-password
          POSTGRES_DB: oap_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run db:migrate
        env:
          DATABASE_MIGRATION_URL: postgres://postgres:ci-only-owner-password@localhost:5432/oap_ci
          RUNTIME_DATABASE_ROLE: eai_runtime
          RUNTIME_DATABASE_PASSWORD: ci-only-runtime-password-0123456789
      - run: npm run test:postgres
        env:
          TEST_DATABASE_URL: postgres://eai_runtime:ci-only-runtime-password-0123456789@localhost:5432/oap_ci
